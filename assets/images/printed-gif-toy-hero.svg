<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1828"/>
      <stop offset="60%" stop-color="#101f36"/>
      <stop offset="100%" stop-color="#0b1423"/>
    </linearGradient>
    <linearGradient id="printArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172a45"/>
      <stop offset="100%" stop-color="#102137"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#66f1c9"/>
      <stop offset="100%" stop-color="#6ca8ff"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="132" y="104" width="688" height="402" rx="18" fill="url(#printArea)" stroke="#36527f" stroke-width="2"/>
  <rect x="132" y="104" width="688" height="402" rx="18" fill="none" stroke="#9ec8ff" stroke-opacity=".12"/>

  <g opacity=".95">
    <rect x="154" y="448" width="598" height="8" rx="4" fill="url(#layer)"/>
    <rect x="154" y="429" width="572" height="7" rx="4" fill="url(#layer)" opacity=".75"/>
    <rect x="154" y="411" width="534" height="6" rx="3" fill="url(#layer)" opacity=".55"/>
    <rect x="154" y="395" width="488" height="5" rx="3" fill="url(#layer)" opacity=".38"/>
  </g>

  <g transform="translate(658 390)">
    <rect x="-36" y="-58" width="72" height="30" rx="8" fill="#d9ecff" stroke="#223b5c" stroke-width="2"/>
    <rect x="-12" y="-28" width="24" height="28" rx="4" fill="#243c5d"/>
    <rect x="-9" y="-2" width="18" height="8" rx="3" fill="#89d6ff"/>
    <ellipse cx="-26" cy="-43" rx="10" ry="5" fill="#74ffd6" opacity=".72" filter="url(#softGlow)"/>
  </g>

  <g opacity=".9">
    <rect x="860" y="162" width="188" height="272" rx="14" fill="#101c30" stroke="#2f4a73" stroke-width="2"/>
    <rect x="888" y="202" width="132" height="14" rx="7" fill="#1e3352"/>
    <circle cx="980" cy="209" r="9" fill="#7edbff"/>
    <rect x="888" y="254" width="132" height="14" rx="7" fill="#1e3352"/>
    <circle cx="940" cy="261" r="9" fill="#66f1c9"/>
    <rect x="888" y="306" width="132" height="14" rx="7" fill="#1e3352"/>
    <circle cx="994" cy="313" r="9" fill="#7edbff"/>
    <rect x="888" y="362" width="58" height="32" rx="9" fill="#1d314f" stroke="#466a9f"/>
    <rect x="962" y="362" width="58" height="32" rx="9" fill="#1d314f" stroke="#466a9f"/>
  </g>
</svg>
